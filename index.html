/* ----------------------------- Хранилище ----------------------------- */
const LS_KEY = "uchet-os-db-v1";
function loadDB() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return JSON.parse(JSON.stringify(SEED));
}
function saveDB(db) { localStorage.setItem(LS_KEY, JSON.stringify(db)); }

function reducer(db, action) {
  const next = JSON.parse(JSON.stringify(db));
  const now = new Date();
  const ts = now.toISOString().slice(0, 16).replace("T", " ");
  const pushEvent = (text) => { next._seq.event++; next.events.unshift({ id: next._seq.event, ts, text }); next.events = next.events.slice(0, 50); };
  switch (action.type) {
    case "RESET": return JSON.parse(JSON.stringify(SEED));
    case "ADD_ASSET": {
      next._seq.asset++;
      const a = { ...action.asset, id: next._seq.asset, statusHistory: [{ status: action.asset.status, reason: "Постановка на учёт", date: action.asset.added_date, by: "Текущий пользователь" }] };
      next.assets.push(a);
      pushEvent(`Добавлено ОС ${a.inv_number} — ${a.name}`);
      return next;
    }
    case "UPDATE_ASSET": {
      const i = next.assets.findIndex(x => x.id === action.asset.id);
      if (i >= 0) next.assets[i] = { ...next.assets[i], ...action.asset };
      pushEvent(`Изменена карточка ОС ${next.assets[i].inv_number}`);
      return next;
    }
    case "CHANGE_STATUS": {
      const a = next.assets.find(x => x.id === action.id);
      if (a) {
        a.statusHistory = a.statusHistory || [];
        a.statusHistory.push({ status: action.status, reason: action.reason, date: action.date, by: action.by || "Текущий пользователь" });
        a.status = action.status;
        pushEvent(`Состояние ${a.inv_number} → «${STATUS[action.status].label}»`);
      }
      return next;
    }
    case "ADD_EMPLOYEE": {
      next._seq.employee++;
      next.employees.push({ ...action.employee, id: next._seq.employee });
      return next;
    }
    case "ADD_MOVEMENT": {
      next._seq.movement++;
      const m = { ...action.movement, id: next._seq.movement };
      next.movements.unshift(m);
      const a = next.assets.find(x => x.id === m.asset_id);
      if (a && m.status === "completed") { a.location_id = m.to_location_id; }
      const aname = a ? a.inv_number : "?";
      pushEvent(`Перемещение ${aname}: ${locName(next, m.from_location_id)} → ${locName(next, m.to_location_id)}`);
      return next;
    }
    case "COMPLETE_MOVEMENT": {
      const m = next.movements.find(x => x.id === action.id);
      if (m) {
        m.status = "completed";
        const a = next.assets.find(x => x.id === m.asset_id);
        if (a) a.location_id = m.to_location_id;
        pushEvent(`Перемещение ${a ? a.inv_number : ""} завершено`);
      }
      return next;
    }
    case "ADD_MAINTENANCE": {
      next._seq.maintenance++;
      next.maintenance.unshift({ ...action.maintenance, id: next._seq.maintenance });
      const a = next.assets.find(x => x.id === action.maintenance.asset_id);
      pushEvent(`Заявка на обслуживание ${a ? a.inv_number : ""}: ${action.maintenance.type}`);
      return next;
    }
    case "ADD_DISPOSAL": {
      next._seq.disposal++;
      next.disposals.unshift({ ...action.disposal, id: next._seq.disposal });
      const a = next.assets.find(x => x.id === action.disposal.asset_id);
      pushEvent(`Акт списания ${a ? a.inv_number : ""}: ${action.disposal.reason}`);
      return next;
    }
    default: return db;
  }
}

/* ----------------------------- Утилиты ----------------------------- */
const locName = (db, id) => (db.locations.find(l => l.id === id) || {}).name || "—";
const empName = (db, id) => (db.employees.find(e => e.id === id) || {}).full_name || "—";
const assetByInv = (db, id) => db.assets.find(a => a.id === id) || {};

function csvExport(filename, rows) {
  const csv = rows.map(r => r.map(c => {
    const s = String(c == null ? "" : c);
    return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(";")).join("\n");
  const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

/* ----------------------------- Панель мониторинга ----------------------------- */
function Dashboard({ db }) {
  const active = db.assets;
  const counts = STATUS_KEYS.reduce((acc, k) => (acc[k] = active.filter(a => a.status === k).length, acc), {});
  const inMove = db.movements.filter(m => m.status !== "completed").length;
  const needAction = counts.broken + counts.replace + counts.upgrade;
  const total = active.length;
  const Metric = ({ label, value, color }) => (
    <div className="bg-white rounded-lg border border-slate-200 p-4">
      <div className={`text-3xl font-bold ${color}`}>{value}</div>
      <div className="text-sm text-slate-500 mt-1">{label}</div>
    </div>
  );
  return (
    <div>
      <h2 className="text-xl font-semibold mb-4">Панель мониторинга</h2>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <Metric label="Всего ОС" value={total} color="text-slate-800" />
        <Metric label="Рабочих" value={counts.working} color="text-emerald-600" />
        <Metric label="Требуют действий" value={needAction} color="text-amber-600" />
        <Metric label="В перемещении" value={inMove} color="text-sky-600" />
      </div>
      <div className="grid md:grid-cols-2 gap-6">
        <div className="bg-white rounded-lg border border-slate-200 p-5">
          <h3 className="font-semibold mb-4">Распределение по состояниям</h3>
          {STATUS_KEYS.map(k => {
            const v = counts[k]; const pct = total ? Math.round(v / total * 100) : 0;
            const barColor = { working: "bg-emerald-500", broken: "bg-rose-500", replace: "bg-amber-500", upgrade: "bg-sky-500" }[k];
            return (
              <div key={k} className="mb-3">
                <div className="flex justify-between text-sm mb-1"><span>{STATUS[k].label}</span><span className="text-slate-500">{v} ({pct}%)</span></div>
                <div className="h-2 bg-slate-100 rounded"><div className={`h-2 rounded ${barColor}`} style={{ width: pct + "%" }}></div></div>
              </div>
            );
          })}
        </div>
        <div className="bg-white rounded-lg border border-slate-200 p-5">
          <h3 className="font-semibold mb-4">Лента последних событий</h3>
          <ul className="space-y-2 max-h-72 overflow-y-auto">
            {db.events.map(e => (
              <li key={e.id} className="text-sm border-l-2 border-sky-300 pl-3">
                <div className="text-slate-700">{e.text}</div>
                <div className="text-xs text-slate-400">{e.ts}</div>
              </li>
            ))}
            {db.events.length === 0 && <li className="text-sm text-slate-400">Событий пока нет</li>}
          </ul>
        </div>
      </div>
    </div>
  );
}

/* ----------------------------- Реестр ОС ----------------------------- */

  const [cardFor, setCardFor] = useState(null);

    const t = q.toLowerCase();
    const okQ = !t || [a.inv_number, a.serial_number, a.name, empName(db, a.employee_id)].some(v => String(v).toLowerCase().includes(t));
    const okS = !fStatus || a.status === fStatus;
    const okL = !fLoc || a.location_id === Number(fLoc);
    return okQ && okS && okL;
  }), [db, q, fStatus, fLoc]);

    const rows = [["Инв. номер", "Серийный номер", "Наименование", "Местонахождение", "Ответственный", "Состояние", "Дата учёта"]];

    csvExport("reestr-os.csv", rows);
  };

  return (
    <div>
      <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
        <h2 className="text-xl font-semibold">Реестр основных средств</h2>
        <div className="flex gap-2">
          <button className={btnGhost} onClick={doExport}>Экспорт CSV</button>
          <button className={btnPrimary} onClick={() => setEditing({ inv_number: "", serial_number: "", name: "", location_id: db.locations[0]?.id, employee_id: db.employees[0]?.id, status: "working", added_date: new Date().toISOString().slice(0,10), notes: "" })}>+ Добавить ОС</button>
        </div>
      </div>
      <div className="flex flex-wrap gap-2 mb-3">
        <input className={inputCls + " max-w-xs"} placeholder="Поиск: инв. №, серийный №, название, ответственный…" value={q} onChange={e => setQ(e.target.value)} />

        <select className={inputCls + " max-w-[200px]"} value={fLoc} onChange={e => setFLoc(e.target.value)}>

          {db.locations.map(l => <option key={l.id} value={l.id}>{l.name}</option>)}

              <th className="px-3 py-2 font-medium">Инв. №</th>
              <th className="px-3 py-2 font-medium">Наименование</th>
              <th className="px-3 py-2 font-medium">Серийный №</th>
              <th className="px-3 py-2 font-medium">Местонахождение</th>
              <th className="px-3 py-2 font-medium">Ответственный</th>
              <th className="px-3 py-2 font-medium">Состояние</th>
              <th className="px-3 py-2 font-medium"></th>
            </tr>
          </thead>
          <tbody>
            {filtered.map(a => (
              <tr key={a.id} className="border-t border-slate-100 hover:bg-slate-50">
                <td className="px-3 py-2 font-mono text-xs">{a.inv_number}</td>

function AssetForm({ db, asset, onClose, onSave }) {
  const [f, setF] = useState({ ...asset });
  const [err, setErr] = useState("");
  const submit = () => {
    if (!f.inv_number.trim()) return setErr("Инвентарный номер обязателен");
    if (!f.name.trim()) return setErr("Наименование обязательно");
    const dup = db.assets.find(a => a.inv_number === f.inv_number.trim() && a.id !== f.id);
    if (dup) return setErr("Инвентарный номер должен быть уникальным");
    onSave({ ...f, inv_number: f.inv_number.trim(), location_id: Number(f.location_id), employee_id: Number(f.employee_id) });
  };
  return (

  const rec = { broken: "Ремонт или списание", replace: "Закупка замены", upgrade: "Модернизация / апгрейд" };
  const exportSummary = () => {
    const rows = [["Инв. номер", "Наименование", "Ответственный", "Местонахождение", "Состояние"]];
    db.assets.forEach(a => rows.push([a.inv_number, a.name, empName(db, a.employee_id), locName(db, a.location_id), STATUS[a.status].label]));
    csvExport("svodnyy-otchet.csv", rows);
  };
  const exportAttention = () => {
    const rows = [["Инв. номер", "Наименование", "Ответственный", "Состояние", "Рекомендация"]];
    attention.forEach(a => rows.push([a.inv_number, a.name, empName(db, a.employee_id), STATUS[a.status].label, rec[a.status]]));
    csvExport("os-trebuyut-vnimaniya.csv", rows);
  };
  return (
    <div>
      <h2 className="text-xl font-semibold mb-4">Отчёты</h2>
      <div className="bg-white rounded-lg border border-slate-200 p-5 mb-6">
        <div className="flex justify-between items-center mb-3">
          <h3 className="font-semibold">Сводный отчёт по всем ОС</h3>
          <button className={btnGhost} onClick={exportSummary}>Экспорт в Excel/CSV</button>
        </div>
        <table className="w-full text-sm">
          <thead className="text-slate-500 text-left"><tr><th className="py-1 font-medium">Инв. №</th><th className="py-1 font-medium">Наименование</th><th className="py-1 font-medium">Ответственный</th><th className="py-1 font-medium">Местонахождение</th><th className="py-1 font-medium">Состояние</th></tr></thead>
          <tbody>{db.assets.map(a => <tr key={a.id} className="border-t border-slate-100"><td className="py-1 font-mono text-xs">{a.inv_number}</td><td className="py-1">{a.name}</td><td className="py-1">{empName(db, a.employee_id)}</td><td className="py-1">{locName(db, a.location_id)}</td><td className="py-1"><Badge status={a.status} /></td></tr>)}</tbody>
        </table>
      </div>
      <div className="bg-white rounded-lg border border-slate-200 p-5">
        <div className="flex justify-between items-center mb-3">
          <h3 className="font-semibold">ОС, требующие замены или модернизации</h3>
          <button className={btnGhost} onClick={exportAttention}>Экспорт в Excel/CSV</button>
        </div>
        <table className="w-full text-sm">
          <thead className="text-slate-500 text-left"><tr><th className="py-1 font-medium">Инв. №</th><th className="py-1 font-medium">Наименование</th><th className="py-1 font-medium">Ответственный</th><th className="py-1 font-medium">Состояние</th><th className="py-1 font-medium">Рекомендация</th></tr></thead>
          <tbody>{attention.map(a => <tr key={a.id} className="border-t border-slate-100"><td className="py-1 font-mono text-xs">{a.inv_number}</td><td className="py-1">{a.name}</td><td className="py-1">{empName(db, a.employee_id)}</td><td className="py-1"><Badge status={a.status} /></td><td className="py-1 text-slate-600">{rec[a.status]}</td></tr>)}
          {attention.length === 0 && <tr><td colSpan="5" className="py-4 text-center text-slate-400">Все ОС в рабочем состоянии</td></tr>}</tbody>
        </table>
      </div>
    </div>
  );
}

/* ----------------------------- Каркас приложения ----------------------------- */
const NAV = [
  { key: "dashboard", label: "Панель мониторинга", icon: "▦" },
  { key: "registry", label: "Реестр ОС", icon: "▤" },
  { key: "locations", label: "Местонахождение", icon: "▣" },
  { key: "employees", label: "Ответственные лица", icon: "☻" },
  { key: "movements", label: "Перемещения", icon: "⇄" },
  { key: "maintenance", label: "Обслуживание", icon: "⚒" },
  { key: "disposal", label: "Утилизация", icon: "♺" },
  { key: "reports", label: "Отчёты", icon: "▥" },
];

function App() {
  const [db, dispatch] = useReducer(reducer, null, loadDB);
  const [tab, setTab] = useState("dashboard");
  useEffect(() => { saveDB(db); }, [db]);

  const reset = () => { if (confirm("Сбросить все данные к демонстрационному набору?")) dispatch({ type: "RESET" }); };

  return (
    <div className="min-h-screen flex">
      <aside className="w-60 bg-slate-900 text-slate-200 flex flex-col shrink-0">
        <div className="px-5 py-4 border-b border-slate-700">
          <div className="font-bold text-white leading-tight">АС Учёт ОС</div>
          <div className="text-xs text-slate-400">Учёт основных средств</div>
        </div>
        <nav className="flex-1 py-2">
          {NAV.map(n => (
            <button key={n.key} onClick={() => setTab(n.key)} className={`w-full text-left px-5 py-2.5 text-sm flex items-center gap-3 ${tab===n.key?"bg-sky-600 text-white":"hover:bg-slate-800"}`}>
              <span className="w-4 text-center opacity-80">{n.icon}</span>{n.label}
            </button>
          ))}
        </nav>
        <div className="px-5 py-3 border-t border-slate-700">
          <button onClick={reset} className="text-xs text-slate-400 hover:text-slate-200">↺ Сбросить демо-данные</button>
        </div>
      </aside>
      <main className="flex-1 overflow-x-hidden">
        <header className="bg-white border-b border-slate-200 px-6 py-3 flex justify-between items-center">
          <div className="text-sm text-slate-500">Автоматизированная система учёта основных средств · v1.0</div>
          <div className="text-sm text-slate-600">Текущий пользователь: <span className="font-medium">Тех. специалист</span></div>
        </header>
        <div className="p-6">
          {tab === "dashboard" && <Dashboard db={db} />}
          {tab === "registry" && <Registry db={db} dispatch={dispatch} />}
          {tab === "locations" && <Locations db={db} />}
          {tab === "employees" && <Employees db={db} dispatch={dispatch} />}
          {tab === "movements" && <Movements db={db} dispatch={dispatch} />}
          {tab === "maintenance" && <Maintenance db={db} dispatch={dispatch} />}
          {tab === "disposal" && <Disposal db={db} dispatch={dispatch} />}
          {tab === "reports" && <Reports db={db} />}
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
